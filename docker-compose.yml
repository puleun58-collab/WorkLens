services:
  valkey:
    image: valkey/valkey:8.1-alpine
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory-policy
      - noeviction
    networks:
      - ephemeral
    read_only: true
    tmpfs:
      - /data:uid=999,gid=999,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${WORKLENS_MINIO_ROOT_USER:?Set WORKLENS_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${WORKLENS_MINIO_ROOT_PASSWORD:?Set WORKLENS_MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"
    networks:
      - ephemeral
    tmpfs:
      - /data:uid=1000,gid=1000,mode=0700
      - /tmp:uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  ephemeral:
    internal: true
